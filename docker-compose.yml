services:
  # NOTE: no `postgres` service here — this stack talks to the HOST Postgres
  # (127.0.0.1:5432 on the host, database `treva_sales_cms`, role `treva`).
  # The container reaches it through the pinned bridge gateway 172.20.0.1
  # (see `extra_hosts` + the external `cms-platform-net` network below).
  # The host must listen on that gateway and allow the docker subnet:
  #   postgresql.conf : listen_addresses = 'localhost,172.20.0.1'
  #   pg_hba.conf     : host treva_sales_cms treva 172.20.0.0/16 scram-sha-256

  cms-api:
    build:
      context: .
      dockerfile: apps/cms-api/Dockerfile
    image: cms-api:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      # Password is URL-encoded in .env (POSTGRES_PASSWORD, `@` -> `%40`) so it
      # is safe to interpolate straight into the connection URI here.
      DB_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@host.docker.internal:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      INGEST_API_KEY: ${INGEST_API_KEY}
      # Single master switch for every cms<->bot sync flow (see bot-sync.service.ts).
      SYNC_ENABLED: ${SYNC_ENABLED:-0}
      BOT_KB_WEBHOOK_URL: ${BOT_KB_WEBHOOK_URL:-}
      BOT_INFO_WEBHOOK_URL: ${BOT_INFO_WEBHOOK_URL:-}
      BOT_BASE_URL: ${BOT_BASE_URL:-}
      BOT_SYNC_API_KEY: ${BOT_SYNC_API_KEY:-}
      # Telegram escalation alerts. Its own switch, not SYNC_ENABLED — this
      # notifies humans in a group chat rather than moving data to the bot.
      # Button taps arrive by long polling, so keep this service to ONE replica:
      # Telegram answers 409 to concurrent getUpdates on the same token.
      TELEGRAM_ALERTS_ENABLED: ${TELEGRAM_ALERTS_ENABLED:-0}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALERT_CHAT_ID: ${TELEGRAM_ALERT_CHAT_ID:-}
      TELEGRAM_ALERT_TIMEZONE: ${TELEGRAM_ALERT_TIMEZONE:-}
      PANEL_BASE_URL: ${PANEL_BASE_URL:-}
    extra_hosts:
      # host.docker.internal -> the cms-platform-net bridge gateway, i.e. the host
      - "host.docker.internal:172.20.0.1"
    expose:
      - "4000"
    volumes:
      - /var/www/treva-sales-agent:/treva_sales_bot
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - default
      - treva_bot_net

  cms-web:
    build:
      context: .
      dockerfile: apps/cms-web/Dockerfile
      args:
        # Build-time only — inlined into the client bundle by `next build`.
        # Changing this requires rebuilding the image, not just restarting it.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WIDGET_URL: ${NEXT_PUBLIC_WIDGET_URL}
    image: cms-web:latest
    restart: unless-stopped
    depends_on:
      - cms-api
    expose:
      - "3001"
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - default

networks:
  # Externally created so the bridge (and its stable 172.20.0.1 gateway that
  # Postgres listens on) survives `docker compose down`:
  #   docker network create --driver bridge \
  #     --subnet=172.20.0.0/16 --gateway=172.20.0.1 cms-platform-net
  default:
    name: cms-platform-net
    external: true
  treva_bot_net:
    external: true
    name: treva-sales-agent_default
